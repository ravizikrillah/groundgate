[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundgate"
version = "0.1.0"
description = "Deterministic Pre-Emission Markdown Claim & Causal-Freshness Compiler for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
groundgate = "groundgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/groundgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
